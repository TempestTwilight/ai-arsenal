[project]
name = "ai-arsenal"
version = "0.1.0"
description = "AI Arsenal is an open ecosystem directory and knowledge hub for AI engineering"
readme = "README.md"
authors = [
    { name = "TempestTwilight", email = "240898001+TempestTwilight@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ai-arsenal = "ai_arsenal:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
